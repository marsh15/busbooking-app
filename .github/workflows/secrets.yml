name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current tracked files
        run: |
          mkdir "$RUNNER_TEMP/secret-scan"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/secret-scan"
          docker run --rm --network none -v "$RUNNER_TEMP/secret-scan:/source:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 dir /source \
            --config /source/.gitleaks.toml --redact --no-banner --ignore-gitleaks-allow
      - name: Scan new commit history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none -v "$PWD:/source:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /source \
            --config /source/.gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact --no-banner --ignore-gitleaks-allow
      - name: Scan commits added by a push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docker run --rm --network none -v "$PWD:/source:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /source \
            --config /source/.gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact --no-banner --ignore-gitleaks-allow
      - name: Scan first push to a branch
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            range="--all"
          else
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
            range="$base..HEAD"
          fi
          docker run --rm --network none -v "$PWD:/source:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /source \
            --config /source/.gitleaks.toml --log-opts="$range" \
            --redact --no-banner --ignore-gitleaks-allow
