name: Database backup
on:
  schedule: [{ cron: "30 20 * * *" }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Validate backup configuration
        run: test -n "$DATABASE_HOST" && test -n "$DATABASE_USER" && test -n "$DATABASE_PASSWORD" && test -n "$DATABASE_NAME"
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      - name: Export database
        run: mysqldump --ssl-mode=REQUIRED --single-transaction --set-gtid-purged=OFF -h "$DATABASE_HOST" -u "$DATABASE_USER" -p"$DATABASE_PASSWORD" "$DATABASE_NAME" | gzip > smartbus.sql.gz
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      - uses: actions/upload-artifact@v4
        with: { name: "smartbus-backup-${{ github.run_id }}", path: smartbus.sql.gz, retention-days: 14 }
