services:
  - type: web
    name: voyagebus-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run typecheck
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-nano
      - key: LOG_LEVEL
        value: info
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: PUBLIC_REGISTRATION
        value: "false"
